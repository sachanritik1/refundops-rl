name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install '.[dev]'
      - run: pytest -q
      - run: python -m refundops_rl.train_toy_policy --episodes 400
      - run: python -m refundops_rl.benchmark --episodes 24 --policy scripted --output /tmp/rollouts.jsonl
