[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "refundops-rl"
version = "0.1.0"
description = "Deterministic multi-step RL environment for refund operations"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
server = ["fastapi>=0.110,<1", "pydantic>=2,<3", "uvicorn>=0.27,<1"]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "fastapi>=0.110,<1", "pydantic>=2,<3"]

[project.scripts]
refundops-benchmark = "refundops_rl.benchmark:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
